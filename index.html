<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamburg City RP | Teamverwaltung</title>
<style>
:root{--bg:#080d18;--panel:#101a2b;--panel2:#142239;--line:#223550;--text:#eaf2ff;--muted:#91a5c2;--blue:#2788ff;--blue2:#1263c7;--red:#ef6262;--green:#42c58a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#102d52 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 20px 70px #0008}.brandmark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#35a2ff,#1451ad);display:grid;place-items:center;font-weight:900;font-size:21px;margin-bottom:16px}.login h1{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:11px 12px;color:var(--text);background:#0b1423;border:1px solid var(--line);border-radius:10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}.btn:hover{background:#1476e8}.btn.secondary{background:#1b2b43;border:1px solid var(--line)}.btn.danger{background:#71313a}.btn.small{padding:6px 9px;font-size:12px}.login .btn{width:100%;margin-top:8px}.hint{font-size:12px;color:var(--muted);margin-top:14px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#0b1321;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.brand .brandmark{margin:0;width:40px;height:40px;font-size:17px}.brand strong{display:block}.brand small{color:var(--muted)}.nav-label{font-size:10px;letter-spacing:1.5px;color:#6f85a4;padding:0 12px;margin-bottom:6px}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;color:#aabbd3;text-align:left;padding:10px 12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#142944;color:white}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.nav .ico{width:20px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0}.userline{display:flex;justify-content:space-between;align-items:center;gap:8px}.userline small{color:var(--muted)}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0b1421cc}.topbar h2{margin:0;font-size:18px}.content{padding:28px 30px;max-width:1500px;margin:auto}.eyebrow{color:#65aaff;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px}.pagehead h1{font-size:28px;margin:3px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#122038,#0e192a);border:1px solid var(--line);border-radius:15px;padding:18px}.stat-label{color:var(--muted);font-size:13px}.stat{font-size:30px;font-weight:750;margin:7px 0 2px}.stat-note{font-size:12px;color:#6e88aa}.section{margin-top:22px}.section h3{margin:0 0 12px;font-size:16px}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px;background:#0e1929}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #1e3048;font-size:13px}th{color:#91a5c2;background:#111f33;font-weight:600}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#18375b;color:#8dc5ff;font-size:11px}.pill.red{background:#49252d;color:#ff9b9b}.pill.green{background:#173c34;color:#83e0bb}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:280px}.empty{padding:26px;text-align:center;color:var(--muted)}.feed{display:grid;gap:12px}.feeditem{padding:12px 0;border-bottom:1px solid var(--line)}.feeditem:last-child{border:0}.feeditem strong{display:block;font-size:13px}.feeditem small{color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .field{margin:0}.formgrid .wide{grid-column:1/-1}.notice{border:1px solid #6d5525;background:#2c2415;color:#f4d38b;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:18px}.modalback{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;right:20px;background:#173c34;color:#a8f0d2;padding:12px 16px;border:1px solid #28775e;border-radius:10px;z-index:10}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:3;padding:10px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}.nav{display:flex;overflow:auto}.nav-label,.side-bottom{display:none}.nav button{white-space:nowrap;padding:9px}.topbar{height:58px;padding:0 16px}.content{padding:20px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.stat{font-size:24px}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.content{padding:16px 11px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
 <div class="login"><div class="brandmark">HC</div><div class="eyebrow">Hamburg City RP</div><h1>Teamverwaltung</h1><p class="muted">Melde dich für den interaktiven Vorschau-Modus an.</p>
  <div class="field"><label>Benutzername</label><input id="loginUser" value="ole" autocomplete="username"></div>
  <div class="field"><label>Passwort</label><input id="loginPass" type="password" value="demo123" autocomplete="current-password"></div>
  <button class="btn" onclick="login()">Anmelden</button><div class="hint">Demo-Zugang: <b>ole</b> / <b>demo123</b><br>Dies ist ein lokaler Prototyp, kein sicherer Online-Login.</div>
 </div>
</div>
<div id="app" class="app hidden">
 <aside class="sidebar">
  <div class="brand"><div class="brandmark">HC</div><div><strong>Hamburg City RP</strong><small>Staff Control Center</small></div></div>
  <div><div class="nav-label">VERWALTUNG</div><nav class="nav" id="nav">
   <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
   <button data-page="warnings"><span class="ico">⚑</span>Verwarnungen</button>
   <button data-page="team"><span class="ico">♙</span>Teamverwaltung</button>
   <button data-page="applications"><span class="ico">▤</span>Bewerbungen</button>
   <button data-page="complaints"><span class="ico">☷</span>Beschwerden</button>
   <button data-page="sanctions"><span class="ico">⛨</span>Sanktionen</button>
   <button data-page="shifts"><span class="ico">◷</span>Dienstzeiten</button>
   <button data-page="logs"><span class="ico">▣</span>Dienstprotokolle</button>
   <button data-page="announcements"><span class="ico">◉</span>Ankündigungen</button>
   <button data-page="notes"><span class="ico">✎</span>Interne Notizen</button>
   <button data-page="activity"><span class="ico">↻</span>Aktivitätsprotokoll</button>
   <button data-page="stats"><span class="ico">▥</span>Statistiken</button>
  </nav></div>
  <div class="side-bottom"><div class="userline"><div><b id="sideUser">Ole</b><br><small>Administrator · Demo</small></div><button class="btn secondary small" onclick="logout()">Abmelden</button></div></div>
 </aside>
 <main class="main"><header class="topbar"><h2 id="topTitle">Dashboard</h2><span class="pill green">● System bereit</span></header><div class="content" id="content"></div></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const seed={
 warnings:[{id:1,name:"Max_Muster",roblox:"12345678",reason:"RDM",staff:"Ole",date:"2026-11-25",status:"Aktiv"}],
 team:[{id:1,name:"Ole",rank:"Administrator",user:"ole",status:"Aktiv"},{id:2,name:"Alex",rank:"Moderator",user:"alex",status:"Aktiv"}],
 applications:[{id:1,name:"Jamie",role:"Moderator",date:"2026-11-26",status:"Offen"}],
 complaints:[{id:1,name:"Spieler123",against:"Max_Muster",reason:"Unangebrachtes Verhalten",date:"2026-11-26",status:"Offen"}],
 sanctions:[{id:1,name:"Max_Muster",type:"Kick",reason:"Regelverstoß",staff:"Ole",date:"2026-11-25"}],
 shifts:[{id:1,name:"Ole",start:"2026-11-27 09:00",end:"2026-11-27 10:30",duration:"1,5 Std."}],
 logs:[{id:1,title:"Moderationsrunde",staff:"Ole",date:"2026-11-26",details:"Tickets und Meldungen geprüft."}],
 announcements:[{id:1,title:"Teammeeting",date:"2026-11-27",body:"Bitte seid heute Abend beim Teammeeting dabei."}],
 notes:[{id:1,title:"Übergabe",staff:"Ole",date:"2026-11-26",body:"Offene Beschwerde zu Spieler123 prüfen."}],
 activity:[{id:1,action:"Demo-Daten geladen",staff:"System",date:"2026-11-27 09:00"}]
};
let db={};Object.keys(seed).forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem("hcrp_"+k))||seed[k]}catch{db[k]=seed[k]}});
let current="dashboard";
const config={
warnings:{title:"Verwarnungssystem",desc:"Spielerverstöße dokumentieren und nachverfolgen.",fields:[["name","Spielername"],["roblox","Roblox-ID"],["reason","Grund","area"],["staff","Bearbeiter"],["date","Datum","date"],["status","Status","select","Aktiv|Aufgehoben"]]},
team:{title:"Teamverwaltung",desc:"Teammitglieder, Ränge und Status verwalten.",fields:[["name","Name"],["rank","Teamrang"],["user","Benutzername"],["status","Status","select","Aktiv|Inaktiv|Suspendiert"]]},
applications:{title:"Bewerbungsverwaltung",desc:"Eingehende Team-Bewerbungen bearbeiten.",fields:[["name","Bewerber"],["role","Gewünschter Rang"],["date","Eingangsdatum","date"],["status","Status","select","Offen|Angenommen|Abgelehnt"]]},
complaints:{title:"Beschwerdesystem",desc:"Spielerbeschwerden aufnehmen und bearbeiten.",fields:[["name","Beschwerdeführer"],["against","Beschwerde gegen"],["reason","Sachverhalt","area"],["date","Datum","date"],["status","Status","select","Offen|In Bearbeitung|Erledigt"]]},
sanctions:{title:"Sanktionsverwaltung",desc:"Kicks, Banns und weitere Maßnahmen protokollieren.",fields:[["name","Spielername"],["type","Maßnahme","select","Verwarnung|Kick|Temporärer Bann|Permanenter Bann"],["reason","Grund","area"],["staff","Bearbeiter"],["date","Datum","date"]]},
shifts:{title:"Dienstzeiten",desc:"Dienstzeiten des Teams erfassen.",fields:[["name","Teammitglied"],["start","Dienstbeginn"],["end","Dienstende"],["duration","Dauer"]]},
logs:{title:"Dienstprotokolle",desc:"Einsätze und erledigte Aufgaben dokumentieren.",fields:[["title","Titel"],["staff","Teammitglied"],["date","Datum","date"],["details","Einzelheiten","area"]]},
announcements:{title:"Ankündigungen",desc:"Interne Informationen für das Team veröffentlichen.",fields:[["title","Überschrift"],["date","Datum","date"],["body","Nachricht","area"]]},
notes:{title:"Interne Notizen",desc:"Interne Hinweise und Übergaben festhalten.",fields:[["title","Titel"],["staff","Erstellt von"],["date","Datum","date"],["body","Notiz","area"]]}
};
function persist(k){localStorage.setItem("hcrp_"+k,JSON.stringify(db[k]))}
function stamp(){return new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}
function log(action){db.activity.unshift({id:Date.now(),action,staff:document.getElementById("sideUser")?.textContent||"Ole",date:stamp()});persist("activity")}
function login(){let u=document.getElementById("loginUser").value.trim();let p=document.getElementById("loginPass").value;if(!u||!p){alert("Bitte Benutzername und Passwort eingeben.");return}document.getElementById("sideUser").textContent=u;document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");render()}
function logout(){document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden")}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(!b)return;current=b.dataset.page;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));render()});
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let title=current==="dashboard"?"Dashboard":current==="activity"?"Aktivitätsprotokoll":current==="stats"?"Statistiken":config[current].title;document.getElementById("topTitle").textContent=title;let c=document.getElementById("content");if(current==="dashboard"){c.innerHTML=dashboard();return}if(current==="stats"){c.innerHTML=stats();return}if(current==="activity"){c.innerHTML=listPage("activity","Aktivitätsprotokoll","Automatisch erfasste Änderungen.",false);return}c.innerHTML=listPage(current,config[current].title,config[current].desc,true)}
function dashboard(){let active=db.warnings.filter(x=>x.status==="Aktiv").length;return `<div class="pagehead"><div><div class="eyebrow">ÜBERSICHT</div><h1>Willkommen zurück, ${esc(document.getElementById("sideUser").textContent)}.</h1><div class="muted">Hier ist die aktuelle Lage von Hamburg City RP.</div></div><button class="btn" onclick="go('warnings')">＋ Verwarnung eintragen</button></div><div class="notice">Vorschau-Modus: Daten werden nur in diesem Browser gespeichert. Für echten Teamzugriff ist ein sicherer Server mit Datenbank und Rollenprüfung erforderlich.</div><div class="grid">${stat("Teammitglieder",db.team.length,"Registrierte Teamkonten")}${stat("Aktive Verwarnungen",active,"Noch nicht aufgehoben")}${stat("Offene Bewerbungen",db.applications.filter(x=>x.status==="Offen").length,"Warten auf Bearbeitung")}${stat("Offene Beschwerden",db.complaints.filter(x=>x.status!=="Erledigt").length,"Noch nicht abgeschlossen")}</div><div class="split section"><div class="card"><h3>Letzte Aktivitäten</h3>${db.activity.slice(0,5).map(x=>`<div class="feeditem"><strong>${esc(x.action)}</strong><small>${esc(x.staff)} · ${esc(x.date)}</small></div>`).join("")||'<div class="empty">Noch keine Aktivitäten.</div>'}</div><div class="card"><h3>Aktuelle Ankündigungen</h3>${db.announcements.slice(0,4).map(x=>`<div class="feeditem"><strong>${esc(x.title)}</strong><small>${esc(x.date)}</small><div>${esc(x.body)}</div></div>`).join("")||'<div class="empty">Keine Ankündigungen.</div>'}</div></div>`}
function stat(label,note,sub){return `<div class="card"><div class="stat-label">${label}</div><div class="stat">${note}</div><div class="stat-note">${sub}</div></div>`}
function go(page){current=page;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===page));render()}
function listPage(key,title,desc,canAdd){let rows=db[key]||[];let cols=key==="activity"?["action","staff","date"]:Object.keys(config[key].fields.reduce((a,f)=>(a[f[0]]=1,a),{}));return `<div class="pagehead"><div><div class="eyebrow">TEAM CONTROL</div><h1>${title}</h1><div class="muted">${desc}</div></div>${canAdd?`<button class="btn" onclick="openForm('${key}')">＋ Eintrag hinzufügen</button>`:""}</div><div class="toolbar"><input id="filter" placeholder="Einträge durchsuchen …" oninput="filterRows('${key}')"><span class="pill">${rows.length} Einträge</span></div><div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${labelFor(key,x)}</th>`).join("")}<th>Aktion</th></tr></thead><tbody id="rows">${rows.map(r=>rowHtml(key,r,cols)).join("")||`<tr><td colspan="${cols.length+1}" class="empty">Noch keine Einträge vorhanden.</td></tr>`}</tbody></table></div>`}
function labelFor(k,x){let f=config[k]?.fields.find(z=>z[0]===x);return f?f[1]:({action:"Aktion",staff:"Bearbeiter",date:"Zeitpunkt"}[x]||x)}
function rowHtml(k,r,cols){return `<tr>${cols.map(x=>`<td>${x==="status"?`<span class="pill ${r[x]==="Aktiv"||r[x]==="Angenommen"||r[x]==="Erledigt"?"green":r[x]==="Offen"?"red":""}">${esc(r[x])}</span>`:esc(r[x])}</td>`).join("")}<td>${k==="activity"?"—":`<button class="btn secondary small" onclick="editItem('${k}',${r.id})">Bearbeiten</button> <button class="btn danger small" onclick="removeItem('${k}',${r.id})">Löschen</button>`}</td></tr>`}
function filterRows(k){let q=document.getElementById("filter").value.toLowerCase();let cols=k==="activity"?["action","staff","date"]:config[k].fields.map(f=>f[0]);document.getElementById("rows").innerHTML=db[k].filter(r=>cols.some(x=>String(r[x]||"").toLowerCase().includes(q))).map(r=>rowHtml(k,r,cols)).join("")||`<tr><td colspan="${cols.length+1}" class="empty">Keine Treffer.</td></tr>`}
function openForm(k,item=null){let cfg=config[k];let fields=cfg.fields.map(f=>{let [id,label,type,opts]=f;let val=item?.[id]??"";let el=type==="area"?`<textarea name="${id}" placeholder="${label}">${esc(val)}</textarea>`:type==="select"?`<select name="${id}">${opts.split("|").map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select>`:`<input name="${id}" ${type==="date"?"type=date":""} value="${esc(val)}" placeholder="${label}">`;return `<div class="field ${type==="area"?"wide":""}"><label>${label}</label>${el}</div>`}).join("");document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${item?"Eintrag bearbeiten":"Neuer Eintrag"} · ${cfg.title}</h3><button class="btn secondary small" onclick="closeModal()">✕</button></div><form onsubmit="saveForm(event,'${k}',${item?.id??"null"})"><div class="formgrid">${fields}</div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn">Speichern</button></div></form></div></div>`}
function saveForm(e,k,id){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(id!==null){let i=db[k].findIndex(x=>x.id===id);db[k][i]={...db[k][i],...data}}else db[k].unshift({id:Date.now(),...data});persist(k);log((id!==null?"Eintrag bearbeitet: ":"Neuer Eintrag: ")+config[k].title);closeModal();render();toast("Änderungen gespeichert")}
function editItem(k,id){openForm(k,db[k].find(x=>x.id===id))}
function removeItem(k,id){if(!confirm("Diesen Eintrag wirklich löschen?"))return;db[k]=db[k].filter(x=>x.id!==id);persist(k);log("Eintrag gelöscht: "+config[k].title);render();toast("Eintrag gelöscht")}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function toast(s){let r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML="",2200)}
function stats(){return `<div class="pagehead"><div><div class="eyebrow">AUSWERTUNG</div><h1>Statistiken</h1><div class="muted">Aktueller Stand der erfassten Vorgänge.</div></div></div><div class="grid">${stat("Teammitglieder",db.team.length,"Gesamt")}${stat("Verwarnungen",db.warnings.length,"Gesamt")}${stat("Sanktionen",db.sanctions.length,"Gesamt")}${stat("Dienstprotokolle",db.logs.length,"Gesamt")}</div><div class="split section"><div class="card"><h3>Vorgänge nach Bereich</h3>${["warnings","applications","complaints","sanctions","logs"].map(k=>`<div class="feeditem"><strong>${config[k].title}</strong><div class="pill">${db[k].length} Einträge</div></div>`).join("")}</div><div class="card"><h3>Hinweis</h3><p class="muted">Diese Statistiken basieren ausschließlich auf den Daten dieses Browsers. Für gemeinsame Live-Auswertungen muss die Anwendung an eine zentrale Datenbank angebunden werden.</p></div></div>`}
</script>
</body></html>
